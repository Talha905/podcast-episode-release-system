spring.profiles.active=dev
spring.application.name=podcast-episode-release-system
server.port=8005

# Persistent H2 Database (Stored in User Home directory so data NEVER disappears on Tomcat restart or Jenkins rebuild)
spring.datasource.url=jdbc:h2:file:~/.podcast_release_data/podcastdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Multipart file upload size limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# OAuth 2.0 Platform Credentials
app.oauth.youtube.client-id=${YOUTUBE_CLIENT_ID:457585540818-5jdmdj090273cvgaskkk34f80893rpri.apps.googleusercontent.com}
app.oauth.youtube.client-secret=${YOUTUBE_CLIENT_SECRET:}

# Mail SMTP Configuration (Gmail)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
