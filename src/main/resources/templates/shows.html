<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Podcast Shows - Podcast Release System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
            color: #334155;
        }
        .navbar-custom { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .card-custom { border: none; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); background: #ffffff; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-4 py-3">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
                <span class="fs-4"><i class="bi bi-mic-fill text-primary"></i></span>
                <span>Podcast Release System</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="/episodes" class="btn btn-outline-light btn-sm rounded-pill px-3"><i class="bi bi-collection-play me-1"></i> Episodes Catalog</a>
                <a href="/platforms" class="btn btn-outline-light btn-sm rounded-pill px-3"><i class="bi bi-broadcast me-1"></i> Platforms & Webhooks</a>
                <a href="/feed.xml" target="_blank" class="btn btn-warning btn-sm rounded-pill px-3 fw-bold"><i class="bi bi-rss-fill me-1"></i> Global RSS 2.0 Feed</a>
            </div>
        </div>
    </nav>

    <div class="container pb-5" style="max-width: 960px;">
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show rounded-3 mb-4 shadow-sm" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Create New Show Card -->
        <div class="card card-custom mb-4">
            <div class="card-body p-4">
                <h4 class="fw-bold mb-3"><i class="bi bi-folder-plus text-primary me-2"></i>Create New Podcast Show / Channel</h4>
                <form th:action="@{/shows/create}" method="post" th:object="${newShow}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Show Title *</label>
                            <input type="text" name="title" class="form-control" placeholder="e.g. Tech & AI Insights" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Author / Host Name *</label>
                            <input type="text" name="author" class="form-control" placeholder="e.g. Talha Patrawala" required>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Show Description *</label>
                            <textarea name="description" class="form-control" rows="2" placeholder="Summary of this podcast show..." required></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Category</label>
                            <input type="text" name="category" class="form-control" value="Technology">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Cover Image URL</label>
                            <input type="text" name="coverImageUrl" class="form-control" placeholder="https://example.com/cover.jpg">
                        </div>
                    </div>
                    <div class="mt-3 text-end">
                        <button type="submit" class="btn btn-primary rounded-pill px-4 fw-semibold"><i class="bi bi-plus-lg me-1"></i> Save Podcast Show</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Existing Shows List -->
        <div class="card card-custom">
            <div class="card-body p-4">
                <h4 class="fw-bold mb-3"><i class="bi bi-collection-play-fill me-2 text-primary"></i>Managed Podcast Channels</h4>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Show Details</th>
                                <th>Author</th>
                                <th>Category</th>
                                <th class="text-end">RSS Feed</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="show : ${shows}">
                                <td class="fw-bold text-muted" th:text="${show.id}">1</td>
                                <td>
                                    <div class="fw-bold text-dark fs-6" th:text="${show.title}">Show Title</div>
                                    <div class="text-muted small" th:text="${show.description}">Description</div>
                                </td>
                                <td><span class="fw-semibold" th:text="${show.author}">Author</span></td>
                                <td><span class="badge bg-light text-dark border" th:text="${show.category}">Technology</span></td>
                                <td class="text-end">
                                    <a th:href="@{/shows/{id}/feed.xml(id=${show.id})}" target="_blank" class="btn btn-sm btn-outline-warning rounded-pill">
                                        <i class="bi bi-rss-fill me-1"></i>Show RSS Feed
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(shows)}">
                                <td colspan="5" class="text-center text-muted py-4">No podcast shows created yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
