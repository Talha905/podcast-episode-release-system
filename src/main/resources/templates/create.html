<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Episode - Podcast Episode Release System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 650px;">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Create New Episode Record</h4>
            </div>
            <div class="card-body p-4">
                <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                <form th:action="@{/episodes/create}" method="post" enctype="multipart/form-data" th:object="${episode}">
                    <div class="mb-3">
                        <label for="title" class="form-label">Episode Title *</label>
                        <input type="text" id="title" name="title" class="form-control" placeholder="e.g. Episode 4: Scaling DevOps Pipelines" required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description / Show Notes *</label>
                        <textarea id="description" name="description" class="form-control" rows="4" placeholder="Enter show notes and episode summary..." required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="audioFile" class="form-label">Upload Audio File (.mp3, .wav, .m4a, .aac, .ogg)</label>
                        <input type="file" id="audioFile" name="audioFile" accept=".mp3,.wav,.m4a,.aac,.ogg" class="form-control">
                        <div class="form-text text-muted">Directly upload audio file from your computer.</div>
                    </div>

                    <div class="mb-3">
                        <label for="audioFileUrl" class="form-label">OR External Audio File URL</label>
                        <input type="text" id="audioFileUrl" name="audioFileUrl" class="form-control" placeholder="e.g. https://storage.podcast.com/audio/ep4.mp3">
                        <div class="form-text text-muted">Alternative: enter external URL if file is hosted elsewhere.</div>
                    </div>

                    <div class="mb-3">
                        <label for="publishDate" class="form-label">Publish Date *</label>
                        <input type="date" id="publishDate" name="publishDate" class="form-control" required th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="/episodes" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-success">Save Episode (Draft)</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
