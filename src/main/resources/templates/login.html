<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Podcast Episode Release System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            background: #ffffff;
            overflow: hidden;
        }
        .brand-header {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            padding: 2rem 1.5rem;
            text-align: center;
        }
        .brand-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            display: inline-block;
        }
        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }
        .btn-primary {
            background-color: #2563eb;
            border: none;
            padding: 0.75rem;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
            transform: translateY(-1px);
        }
        .demo-box {
            background-color: #f8fafc;
            border-radius: 10px;
            padding: 1rem;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 440px;">
        <div class="login-card">
            <div class="brand-header">
                <div class="brand-icon"><i class="bi bi-mic-fill"></i></div>
                <h4 class="fw-bold mb-1">Podcast Release System</h4>
                <p class="text-white-50 mb-0 small">Sign in to manage and automate episode releases</p>
            </div>
            <div class="card-body p-4">
                <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center mb-4" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <div th:text="${successMessage}"></div>
                </div>
                <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center mb-4" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <div>Invalid username or password.</div>
                </div>
                <div th:if="${param.logout}" class="alert alert-info d-flex align-items-center mb-4" role="alert">
                    <i class="bi bi-info-circle-fill me-2"></i>
                    <div>You have been signed out successfully.</div>
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" id="username" name="username" class="form-control" placeholder="producer, host, or admin" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" id="password" name="password" class="form-control" placeholder="password123" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</button>
                </form>

                <div class="text-center mb-3">
                    <span class="text-muted small">Don't have an account?</span>
                    <a th:href="@{/signup}" class="fw-bold text-decoration-none small text-primary ms-1"><i class="bi bi-person-plus-fill me-1"></i>Create one here</a>
                </div>

                <div class="demo-box mt-3">
                    <div class="fw-bold text-dark mb-2 small"><i class="bi bi-key-fill text-primary me-1"></i> Demo Accounts (Password: <code>password123</code>):</div>
                    <div class="d-flex flex-column gap-1 small">
                        <div><span class="badge bg-primary me-1">PRODUCER</span> <code>producer</code></div>
                        <div><span class="badge bg-info text-dark me-1">HOST</span> <code>host</code></div>
                        <div><span class="badge bg-dark me-1">ADMIN</span> <code>admin</code></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
