<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Podcast Episode Release System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 450px;">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white text-center">
                <h3>Podcast Release System</h3>
                <p class="mb-0">Sign in to your account</p>
            </div>
            <div class="card-body p-4">
                <div th:if="${param.error}" class="alert alert-danger">
                    Invalid username or password.
                </div>
                <div th:if="${param.logout}" class="alert alert-info">
                    You have been logged out.
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" name="username" class="form-control" placeholder="producer, host, or admin" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="password123" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Sign In</button>
                </form>

                <div class="mt-4 border-top pt-3 text-muted small">
                    <strong>Default Demo Credentials:</strong>
                    <ul>
                        <li><code>producer</code> / <code>password123</code> (PRODUCER)</li>
                        <li><code>host</code> / <code>password123</code> (HOST)</li>
                        <li><code>admin</code> / <code>password123</code> (ADMIN)</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
