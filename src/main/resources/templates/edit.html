<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Episode - Podcast Episode Release System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
            color: #334155;
        }
        .card-custom {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            background: #ffffff;
            overflow: hidden;
        }
        .header-warning {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            color: #ffffff;
            padding: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container my-5" style="max-width: 680px;">
        <div class="card card-custom">
            <div class="header-warning text-center">
                <div class="fs-2 mb-1"><i class="bi bi-pencil-square"></i></div>
                <h4 class="fw-bold mb-1">Edit Episode Metadata</h4>
                <p class="text-white-50 mb-0 small">Episode ID: <strong th:text="${episode.id}">1</strong></p>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/episodes/{id}/edit(id=${episode.id})}" method="post" enctype="multipart/form-data" th:object="${episode}">
                    <div class="mb-3">
                        <label for="title" class="form-label fw-semibold">Episode Title *</label>
                        <input type="text" id="title" name="title" class="form-control" th:value="${episode.title}" required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label fw-semibold">Description / Show Notes *</label>
                        <textarea id="description" name="description" class="form-control" rows="4" th:text="${episode.description}" required></textarea>
                    </div>

                    <div class="mb-3 p-3 bg-light rounded-3 border">
                        <label for="audioFile" class="form-label fw-semibold text-warning"><i class="bi bi-cloud-upload me-1"></i> Upload New Audio File (.mp3, .wav, .m4a, .aac, .ogg)</label>
                        <input type="file" id="audioFile" name="audioFile" accept=".mp3,.wav,.m4a,.aac,.ogg" class="form-control">
                        <div class="form-text text-muted">Upload a new audio file to replace current audio reference.</div>
                    </div>

                    <div class="mb-3">
                        <label for="audioFileUrl" class="form-label fw-semibold">Current / External Audio File URL</label>
                        <input type="text" id="audioFileUrl" name="audioFileUrl" class="form-control" th:value="${episode.audioFileUrl}">
                    </div>

                    <div class="mb-4">
                        <label for="publishDate" class="form-label fw-semibold">Target Publish Date *</label>
                        <input type="date" id="publishDate" name="publishDate" class="form-control" th:value="${episode.publishDate}" required>
                    </div>

                    <div class="d-flex justify-content-between pt-2">
                        <a th:href="@{/episodes/{id}(id=${episode.id})}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                        <button type="submit" class="btn btn-warning rounded-pill px-4 fw-semibold text-white">
                            <i class="bi bi-check-lg me-1"></i> Update Metadata
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
