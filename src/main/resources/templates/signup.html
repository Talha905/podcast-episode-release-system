<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account - Podcast Episode Release System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .signup-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            background: #ffffff;
            overflow: hidden;
        }
        .brand-header {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            padding: 2rem 1.5rem;
            text-align: center;
        }
        .brand-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            display: inline-block;
        }
        .form-control:focus, .form-select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }
        .btn-primary {
            background-color: #2563eb;
            border: none;
            padding: 0.75rem;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="container my-4" style="max-width: 460px;">
        <div class="signup-card">
            <div class="brand-header">
                <div class="brand-icon"><i class="bi bi-person-plus-fill"></i></div>
                <h4 class="fw-bold mb-1">Create an Account</h4>
                <p class="text-white-50 mb-0 small">Register a new user account for the release system</p>
            </div>
            <div class="card-body p-4">
                <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center mb-4" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <div th:text="${errorMessage}"></div>
                </div>

                <form th:action="@{/signup}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" id="username" name="username" class="form-control" placeholder="Choose a unique username" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="role" class="form-label fw-semibold">User Role *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-shield-check"></i></span>
                            <select id="role" name="role" class="form-select" required>
                                <option value="PRODUCER" selected>PRODUCER (Create episodes, update metadata, transition status)</option>
                                <option value="HOST">HOST (View episodes, view dashboard, override status)</option>
                                <option value="ADMIN">ADMIN (Full access: Create, edit, view audit, override status)</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-3">
                        <i class="bi bi-check-circle-fill me-2"></i>Create Account
                    </button>
                </form>

                <div class="text-center pt-2 border-top">
                    <span class="text-muted small">Already have an account?</span>
                    <a th:href="@{/login}" class="fw-bold text-decoration-none small text-primary ms-1"><i class="bi bi-box-arrow-in-right me-1"></i>Sign in here</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
