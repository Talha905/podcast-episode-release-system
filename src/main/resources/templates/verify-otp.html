<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verify Registration OTP - Podcast Release System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
            color: #334155;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-custom {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            overflow: hidden;
        }
        .header-gradient {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            padding: 2rem 1.5rem;
        }
        .otp-input {
            letter-spacing: 0.5rem;
            font-size: 1.75rem;
            font-weight: 700;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card card-custom">
        <div class="header-gradient text-center">
            <div class="fs-1 mb-2"><i class="bi bi-shield-check text-primary"></i></div>
            <h4 class="fw-bold mb-1">Verify Email Address</h4>
            <p class="text-white-50 mb-0 small">Enter the 6-digit OTP code sent to your email</p>
        </div>
        <div class="card-body p-4">
            <div th:if="${successMessage}" class="alert alert-success rounded-3 mb-4 small" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger rounded-3 mb-4 small" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
            </div>
            <div th:if="${latestOtp}" class="alert alert-info rounded-3 mb-4 small text-center" role="alert">
                <i class="bi bi-shield-lock-fill me-2 text-primary"></i><strong>Verification Code (Dev/Helper):</strong> <span class="badge bg-primary fs-6 ms-1 px-3 py-1" th:text="${latestOtp}">123456</span>
            </div>

            <form th:action="@{/verify-otp}" method="post">
                <div class="mb-4 text-center">
                    <label for="otpCode" class="form-label text-muted small fw-semibold">6-DIGIT VERIFICATION CODE</label>
                    <input type="text" id="otpCode" name="otpCode" class="form-control otp-input py-2" maxlength="6" placeholder="000000" required autofocus autocomplete="off">
                    <input type="hidden" name="email" th:value="${email}">
                    <div class="form-text mt-2 small text-muted">
                        Verification code sent to <strong th:text="${email}">user@example.com</strong> (expires in 15 mins).
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2.5 rounded-pill fw-semibold mb-3">
                    <i class="bi bi-patch-check me-1"></i> Verify & Activate Account
                </button>
            </form>

            <div class="text-center pt-2 border-top">
                <span class="small text-muted">Didn't receive the email? Check console/logs or </span>
                <a th:href="@{/signup}" class="small text-decoration-none fw-semibold">Sign Up Again</a>
            </div>
        </div>
    </div>
</body>
</html>
