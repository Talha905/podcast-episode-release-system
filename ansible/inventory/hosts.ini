# ==============================================================================
# Ansible Inventory for Podcast Episode Release System
# ==============================================================================

[local]
localhost ansible_connection=local

[staging]
staging-server.podcastrelease.internal ansible_host=192.168.1.101 ansible_user=ubuntu

[production]
prod-app-01.podcastrelease.internal ansible_host=192.168.1.102 ansible_user=ubuntu
prod-app-02.podcastrelease.internal ansible_host=192.168.1.103 ansible_user=ubuntu

[app_servers:children]
local
staging
production

[app_servers:vars]
ansible_python_interpreter=/usr/bin/python3
app_environment=prod
app_port=8005
