---
# Default configuration variables for podcast_release role

# System User & Group
app_user: "podcast"
app_group: "podcast"
app_user_shell: "/bin/bash"

# Base Directory Paths
app_root_dir: "/opt/podcast-release"
app_uploads_dir: "/opt/podcast-release/uploads"
app_logs_dir: "/var/log/podcast-release"
app_config_dir: "/opt/podcast-release/config"

# Network & Ports
app_port: 8005
jenkins_port: 8080
ssh_port: 22

# System Prerequisites Packages
required_packages:
  - openjdk-17-jdk-headless
  - curl
  - git
  - tar
  - ufw
  - docker.io
  - python3
  - python3-pip

# Service & Runtime Settings
service_name: "podcast-release"
java_min_memory: "256m"
java_max_memory: "512m"
app_environment: "prod"
active_profile: "prod"
