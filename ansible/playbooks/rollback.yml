---
# ==============================================================================
# Week 14: Automated Rollback and Recovery Playbook
# ==============================================================================
- name: Rollback Application to Previous Stable Release
  hosts: app_servers
  become: yes
  vars:
    app_port: 8005
    health_url: "http://localhost:{{ app_port }}/login"
    backup_file: "/opt/podcast-release/podcast-release.war.backup"
    current_file: "/opt/podcast-release/podcast-release.war"
    service_name: "podcast-release"

  tasks:
    - name: 1. Stop current application service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: stopped

    - name: 2. Verify previous stable backup exists
      ansible.builtin.stat:
        path: "{{ backup_file }}"
      register: backup_stat

    - name: Fail if no backup artifact is present
      ansible.builtin.fail:
        msg: "Cannot rollback: previous release backup artifact {{ backup_file }} does not exist!"
      when: not backup_stat.stat.exists

    - name: 3. Restore previous stable release artifact
      ansible.builtin.copy:
        src: "{{ backup_file }}"
        dest: "{{ current_file }}"
        remote_src: yes
        owner: podcast
        group: podcast
        mode: '0644'

    - name: 4. Restart application service with restored release
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: started

    - name: 5. Verify application recovery with automated health check
      ansible.builtin.uri:
        url: "{{ health_url }}"
        method: GET
        status_code: 200
        timeout: 10
      register: rollback_health
      until: rollback_health.status == 200
      retries: 10
      delay: 3

    - name: 6. Confirm rollback success
      ansible.builtin.debug:
        msg: "Rollback and recovery completed successfully. Node restored and healthy at {{ health_url }}"
