version: '3.8'

services:
  podcast-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: podcast-episode-release-system:1.0.0
    container_name: podcast-release-system
    restart: unless-stopped
    ports:
      - "8005:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Djava.awt.headless=true -Xms256m -Xmx512m
    volumes:
      - podcast-uploads:/opt/podcast-release/uploads
      - podcast-logs:/opt/podcast-release/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - podcast-net

networks:
  podcast-net:
    driver: bridge

volumes:
  podcast-uploads:
    name: podcast-release-uploads
  podcast-logs:
    name: podcast-release-logs
